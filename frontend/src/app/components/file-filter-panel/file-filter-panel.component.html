<div class="filter-panel" [class.collapsed]="collapsed">
  <!-- Arrow toggle button always visible -->
  <button class="toggle-btn" (click)="togglePanel()">
    <i class="fas" [class.fa-chevron-left]="!collapsed" [class.fa-chevron-right]="collapsed"></i>
  </button>

  <!-- Filter panel content -->
  <div class="filter-content" *ngIf="!collapsed">

    <select [(ngModel)]="selectedFilter" class="form-select mb-2">
      <option *ngFor="let opt of filterOptions" [value]="opt">{{ opt }}</option>
    </select>

    <label><strong>Uploaded Files:</strong></label>
    <div class="file-list">
      <div *ngFor="let name of fileNames" class="file-name">{{ name }}</div>
    </div>
  </div>
</div>
