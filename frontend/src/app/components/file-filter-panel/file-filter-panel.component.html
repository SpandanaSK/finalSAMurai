<div class="filter-panel" [class.collapsed]="collapsed">
  <button class="toggle-btn" (click)="togglePanel()">
    <i class="fas fa-chevron-left" *ngIf="!collapsed"></i>
    <i class="fas fa-chevron-right" *ngIf="collapsed"></i>
  </button>

  <div class="filter-content" *ngIf="!collapsed">
    <select class="form-select mb-2" [(ngModel)]="selectedFilter">
      <option *ngFor="let option of filterOptions">{{ option }}</option>
    </select>

    <div class="file-list">
      <div
        class="file-item"
        *ngFor="let fileName of fileNames"
        [class.selected]="fileName === selectedFileName"
        (click)="selectFile(fileName)"
      >
        {{ fileName }}
      </div>
    </div>
  </div>
</div>
