<div *ngIf="visible" class="modal-backdrop" (click)="hide()"></div>

<div *ngIf="visible" class="modal" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-xl modal-dialog-centered">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Save Temp Project</h1>
        <button type="button" class="btn-close" (click)="hide()"></button>
      </div>

      <div class="modal-body" style="max-height: 75vh; overflow-y: auto;">
        <div class="container-fluid">
          <div class="row mb-2">
            <div class="col-md-3"><label for="save-project-name" class="col-form-label">Project Name</label></div>
            <div class="col-md-9">
              <input type="text" class="form-control" id="save-project-name" 
                     [(ngModel)]="projectName" (input)="filterProjects()">
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-3"><label for="save-project-description" class="col-form-label">Project Description</label></div>
            <div class="col-md-9">
              <textarea id="save-project-description" class="form-control" rows="4" style="resize: vertical;"
                        [(ngModel)]="projectDescription" (input)="filterProjects()"></textarea>
            </div>
          </div>
          <div class="row mb-2">
            <div class="col-md-3"><label for="save-created-by" class="col-form-label">Created By</label></div>
            <div class="col-md-9">
              <input type="text" class="form-control" id="save-created-by" 
                     [(ngModel)]="createdBy" (input)="filterProjects()">
            </div>
          </div>
          <div class="row mb-3">
            <div class="col-md-3"><label for="save-created-on" class="col-form-label">Created On</label></div>
            <div class="col-md-9">
              <input type="text" class="form-control" id="save-created-on" 
                     [value]="createdOn" disabled>
            </div>
          </div>
        </div>
        
        <hr class="my-4">

        <div class="table-responsive-sm" style="max-height: 300px; overflow-y: auto;">
          <table class="table table-bordered table-hover mb-0">
            <thead class="table sticky-top">
              <tr>
                <th>Project Name</th>
                <th>Project Description</th>
                <th>Created By</th>
                <th>Created On</th>
                <th># Images</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let project of filteredProjects">
                <td>{{project['Project Name']}}</td>
                <td>{{project['Project Description']}}</td>
                <td>{{project['Created by']}}</td>
                <td>{{project['Created on']}}</td>
                <td>{{project['# Images']}}</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="modal-footer d-flex justify-content-end">
        <div>
          <button class="btn btn-success me-2" 
                  [disabled]="saveButtonDisabled"
                  (click)="saveTemporaryProject()">
            Save Current/Temporary Project
          </button>
          <button class="btn btn-secondary me-2" 
                  (click)="exportProjectAsJSON()">
            Export Project as JSON
          </button>
          <button class="btn btn-danger" (click)="hide()">Cancel</button>
        </div>
      </div>
    </div>
  </div>
</div>
