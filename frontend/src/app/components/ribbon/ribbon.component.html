<div class="ribbon-container">
  <!-- Ribbon header with all main buttons -->
  <div class="ribbon-header">
      <app-annotation-button></app-annotation-button>

    <button (click)="toggleRegionShape()">Region Shapes</button>
    <button (click)="toggleAiPromptShapes()">AI Prompt Shapes</button>
    <button (click)="toggleAiDetection()">AI Detection</button>
    <button (click)="toggleAttributes()">Attributes</button>
    <button (click)="toggleProject()">Project</button>



  </div>
  

  <!-- Region Shape Sub-Ribbon -->
  <div class="ribbon-sub" *ngIf="showRegionShapes">
    <div class="shape-button" *ngFor="let shape of [

      {icon: '▭', label: 'Rectangle (Shortcut key 1)'},
      {icon: '◯', label: 'Circle (Shortcut key 2)'},
      {icon: '⬭', label: 'Ellipse (Shortcut key 3)'},
      {icon: '⬠', label: 'Polygon (Shortcut key 4)'},
      {icon: '•', label: 'Point (Shortcut key 5)'},
      {icon: '⤿', label: 'Polyline (Shortcut key 6)'}
    ]">
      <span class="icon">{{ shape.icon }}</span>
      <div class="hover-label">{{ shape.label }}</div>
    </div>
  </div>

  <!-- AI Prompt Shapes Sub-Ribbon -->
  <div class="ribbon-sub" *ngIf="showAiPrompts">
    <div class="model-selection">
      <label>Single Image Model:</label>
      <select [(ngModel)]="selectedSingleModel">
        <option *ngFor="let model of singleImageModels" [value]="model">{{ model }}</option>
      </select>

      <label>Multi Image Model:</label>
      <select [(ngModel)]="selectedMultiModel">
        <option *ngFor="let model of multiImageModels" [value]="model">{{ model }}</option>
      </select>

      <label>Start Frame:</label>
      <input type="number" [(ngModel)]="startFrame" />

      <label>End Frame:</label>
      <input type="number" [(ngModel)]="endFrame" />

      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="reverseVideo" />
        Reverse video
      </label>
    </div>

    <div class="shape-button" *ngFor="let icon of [
      {icon: '＋', label: 'Positive Point (Shortcut key Q)'},
      {icon: '−', label: 'Negative Point (Shortcut key E)'},
      {icon: '▭', label: 'Box Prompt (Shortcut key B)'}
    ]">
      <span class="icon">{{ icon.icon }}</span>
      <div class="hover-label">{{ icon.label }}</div>
    </div>
  </div>

  <!-- AI Detection Sub-Ribbon -->
  <div class="ribbon-sub" *ngIf="showAiDetection">
    <app-ai-detection></app-ai-detection>
  </div>

  <!-- Attributes Sub-Ribbon -->
  <div class="ribbon-sub" *ngIf="showAttributes">
    <app-attributes></app-attributes>
  </div>
</div>

  <!-- ...existing code... -->
<app-project (imageSelected)="onImageSelected($event)"></app-project>
<!-- Project Sub-Ribbon -->
<div class="ribbon-sub" *ngIf="showProjectOptions">
  <button class="action-btn" (click)="createProjectModal.show()">Create/Load Project</button>
  <!--<button class="action-btn" (click)="uploadButton.triggerFileInput()">Upload Project</button> -->
  <button class="action-btn" (click)="saveTempProjectModal.show(currentProject)">Save Temporary Project</button>

  <!-- Modal/component instances with template refs -->
  <app-create-project-modal #createProjectModal
    (projectCreated)="onProjectCreated($event)"
    (projectLoaded)="onProjectLoaded($event)"
    (tempProjectCreated)="onTempProjectCreated($event)">
  </app-create-project-modal>

  <app-upload-button (imageSelected)="onImageSelected($event)"></app-upload-button>


  <app-save-temp-project-modal #saveTempProjectModal
    (projectSaved)="onProjectSaved($event)"
    (projectExported)="onProjectExported($event)">
  </app-save-temp-project-modal>

  
</div>
