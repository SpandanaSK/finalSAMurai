<div class="canvas-container" style="position: relative;">
  <!-- Previous Arrow (show only if not on first image) -->
  <button 
    *ngIf="!showGridView && imageFiles.length > 1 && currentIndex > 0" 
    class="nav-button left" 
    (click)="previousImage()"
  >&#8249;</button>

  <!-- Next Arrow (show only if not on last image) -->
  <button 
    *ngIf="!showGridView && imageFiles.length > 1 && currentIndex < imageFiles.length - 1" 
    class="nav-button right" 
    (click)="nextImage()"
  >&#8250;</button>


  <!-- Canvas with scrollbars when zoomed in -->
  <div #cornerstoneElement class="cornerstone-canvas"
     style="width:100%; height:512px; background:black;"
     (mousedown)="onCanvasMouseDown($event)"
     (mousemove)="onCanvasMouseMove($event)"
     (mouseup)="onCanvasMouseUp()"></div>
  </div>
    <div *ngIf="showGridView && totalGridPages() > 1" class="grid-pagination">
    <button (click)="prevGridPage()" [disabled]="gridPage === 0">Prev</button>
    <span>Page {{ gridPage + 1 }} / {{ totalGridPages() }}</span>
    <button (click)="nextGridPage()" [disabled]="gridPage >= totalGridPages() - 1">Next</button>
  </div>
